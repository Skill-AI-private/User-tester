  - Có bước nào rườm rà, thừa thãi khiến bạn muốn thoát trang ngay không?
  - Bạn có thấy thông tin quan trọng nhất (nút Mua/Đăng ký, giá cả) ngay trong 3 giây đầu không?
  - Thiết kế có hiện đại, mượt mà hay tạo cảm giác cũ kỹ, chậm chạp?
